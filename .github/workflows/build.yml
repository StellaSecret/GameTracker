name: CI/CD GameTracker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  security-events: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── PARALLEL SECURITY JOBS ────────────────────────────
  scan-secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          head: ${{ github.sha }}
          extra_args: --only-verified

  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript
      - name: Perform Analysis
        uses: github/codeql-action/analyze@v4

  flutter-audit:
    name: Flutter Audit & Placeholders
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Get Dependencies
        run: flutter pub get
      - name: Verify No Secrets in Code
        run: |
          if grep -q "AIzaSy" web/index.html; then
            echo "❌ Google API Key détectée dans l'index !" && exit 1
          fi
      - name: Flutter Analyze
        run: flutter analyze --no-fatal-infos

  # ── PARALLEL TEST JOBS ────────────────────────────────
  unit-tests:
    name: Flutter Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Get Dependencies
        run: flutter pub get
      - name: Run Tests
        run: flutter test --no-pub --reporter=expanded
      - name: Test Coverage
        if: github.event_name == 'pull_request'
        run: |
          flutter test --no-pub --coverage
          if command -v lcov &> /dev/null; then
            lcov --summary coverage/lcov.info
          else
            echo "lcov not available, skipping summary"
          fi
      - name: Upload Coverage Report
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-${{ github.run_number }}
          path: coverage/lcov.info
          retention-days: 7

  e2e-android:
    name: E2E – Android Emulator (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Scenarios S1-S12 are split across two independent test files
        # (integration_test/app_test_part1.dart, app_test_part2.dart —
        # see helpers.dart for the shared boot/interaction code they both
        # use) so they can run concurrently on two emulators instead of
        # one, roughly halving E2E wall-clock time. Each shard still boots
        # its own app instance exactly once, so per-scenario cost is
        # unchanged — only the number of scenarios per job is reduced.
        shard: [part1, part2]
    steps:
      - uses: actions/checkout@v7
      - name: Free up disk space
        run: |
          echo "Disk space before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          echo "Disk space after cleanup:"
          df -h
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
            android/.gradle
            build/app
          # Dependencies (jars/AARs) rarely change and are shared across all
          # runs via restore-keys. The project build cache (org.gradle.caching,
          # enabled in android/gradle.properties) additionally lets Gradle skip
          # re-running tasks whose inputs are unchanged since the last run with
          # the same key, which is where most of assembleDebug's ~4min goes.
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'pubspec.lock') }}-${{ github.sha }}
          restore-keys: |
            gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'pubspec.lock') }}-
            gradle-${{ runner.os }}-
      - name: Cache Android SDK system image
        uses: actions/cache@v5
        with:
          path: /usr/local/lib/android/sdk/system-images
          key: android-sdk-image-30-aosp_atd-x86_64
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Create stub google-services.json
        run: |
          cat > android/app/google-services.json << 'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id":     "game-tracker-stub",
              "storage_bucket": "game-tracker-stub.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                "android_client_info": { "package_name": "com.stellasecret.gametracker" }
              },
              "oauth_client":  [],
              "api_key":       [{ "current_key": "stub" }],
              "services":      { "appinvite_service": { "other_platform_oauth_client": [] } }
            }],
            "configuration_version": "1"
          }
          JSON
      - name: Write E2E runner script
        run: |
          cat > /tmp/e2e_run.sh << SCRIPT
          #!/bin/sh
          set -e
          echo "Waiting for package manager..."
          i=0
          while [ "\$i" -lt 60 ]; do
            if adb shell pm path android 2>/dev/null | grep -q "package:"; then
              echo "Package manager ready after \${i}s"
              break
            fi
            echo "  pm not ready yet (\${i}s)..."
            sleep 1
            i=\$((i + 1))
          done
          sleep 2
          adb logcat -c
          adb logcat -s Flutter -s AndroidRuntime -s ActivityManager -s ActivityTaskManager -s art -s DEBUG > /tmp/logcat.txt 2>&1 &
          LOGCAT_PID=\$!
          echo "logcat PID: \$LOGCAT_PID"
          set +e
          echo "=== flutter test (${{ matrix.shard }}) starting at \$(date -u +%H:%M:%S) ==="
          timeout 1200 flutter test integration_test/app_test_${{ matrix.shard }}.dart --no-pub --dart-define=INTEGRATION_TEST=true --reporter expanded --timeout 20m -d emulator-5554
          TEST_EXIT=\$?
          echo "=== flutter test (${{ matrix.shard }}) exited \$TEST_EXIT at \$(date -u +%H:%M:%S) ==="
          # (note: \$( ) sequences above are escaped so they evaluate when
          # e2e_run.sh actually runs on the emulator, not when this heredoc
          # is written out during the workflow step)
          set -e
          kill "\$LOGCAT_PID" 2>/dev/null || true
          sleep 1
          echo "===== LOGCAT (last 200 lines) ====="
          tail -200 /tmp/logcat.txt || true
          echo "===== END LOGCAT ====="
          exit "\$TEST_EXIT"
          SCRIPT
          chmod +x /tmp/e2e_run.sh
          echo "Generated /tmp/e2e_run.sh:"
          cat /tmp/e2e_run.sh

      - name: Run E2E tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: aosp_atd
          arch: x86_64
          profile: pixel
          avd-name: gt_e2e_${{ matrix.shard }}
          disable-animations: true
          cores: 2
          ram-size: 3072M
          heap-size: 512M
          disk-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: /tmp/e2e_run.sh

      - name: Upload failure artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failure-${{ matrix.shard }}-${{ github.run_number }}
          path: |
            /tmp/logcat.txt
            build/integration_test/
            /tmp/*.png
          retention-days: 7

  # ── PARALLEL MUTATION TEST JOBS ──────────────────────
  # Runs mutation_test (mutation_test.xml) on the pure-logic model files only
  # (lib/models/) — widgets/services/Firebase are excluded until unit tests
  # cover them. Each shard mutates its files in parallel; coverage-guided
  # (--coverage lcov.info) so only test-exercised lines are mutated.
  # Blocking: the job fails on any missed mutant OR infrastructure failure
  # (unparseable/empty report). mutants_summary exits 0, 1 (missed) or
  # 2 (infra); both 1 and 2 gate the build below.
  mutation-tests:
    name: Mutation Tests (${{ matrix.name }})
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: stats
            files: lib/models/stats_engine.dart
            timeout: 900
          - name: game
            files: lib/models/game.dart lib/models/game_session.dart
            timeout: 1500
          - name: appdata
            files: lib/models/app_data.dart lib/models/player.dart lib/models/game_mode.dart lib/models/game_mode_l10n.dart lib/models/entitlement.dart
            timeout: 1500
          - name: services
            files: lib/services/storage_service.dart lib/services/mock_data_generator.dart lib/services/google_sign_in_singleton.dart lib/config/test_flags.dart
            timeout: 900
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Collect coverage for routing
        # --coverage only mutates lines actually exercised by the suite,
        # skipping untouched code (e.g. entitlement.dart) and cutting mutant
        # count. Also acts as a baseline sanity check of the unit tests.
        run: flutter test --no-pub --coverage
      - name: "Run mutation tests (${{ matrix.name }})"
        id: mutants
        run: |
          set -o pipefail
          i=0
          fatal=0
          missed=0
          TIMEOUT="${{ matrix.timeout }}"
          if [ -z "$TIMEOUT" ]; then
            TIMEOUT=1500
          fi
          for f in ${{ matrix.files }}; do
            echo "::group::$f"
            out="work-$i"
            # -r loads mutation_test.xml as the global RULES document (its
            # <commands>/<exclude>/<threshold> apply to every input); -b keeps
            # the builtin mutation rules. Source file is a positional INPUT,
            # which the tool ignores whenever an XML positional is present.
            timeout "$TIMEOUT" dart run mutation_test -b -r mutation_test.xml \
              --coverage coverage/lcov.info -f all -o "$out" "$f" && ec=0 || ec=$?
            if [ "$ec" -ne 0 ]; then
              echo "WARN: mutation_test exited $ec on $f (report may still be valid)"
            fi
            python3 scripts/mutants_summary.py \
              "$out/mutation-test.junit.xml" "$out" && p=0 || p=$?
            echo "::endgroup::"
            if [ "$p" -eq 2 ]; then
              echo "FATAL: mutants_summary exited 2 (infrastructure failure)"
              fatal=2
            elif [ "$p" -eq 1 ]; then
              echo "BLOCKING: missed mutants detected on $f"
              missed=1
            fi
            i=$((i + 1))
          done
          mkdir -p mutants.out
          for d in work-*/mutants.out; do
            for k in caught missed unviable notcovered; do
              [ -f "$d/$k.txt" ] && cat "$d/$k.txt" >> "mutants.out/$k.txt" || true
            done
          done
          cnt() { [ -f "mutants.out/$1.txt" ] && wc -l < "mutants.out/$1.txt" || echo 0; }
          echo "Merged $(cnt caught) caught, $(cnt missed) missed, $(cnt unviable) unviable, $(cnt notcovered) notcovered"
          # A null tag file marks infrastructure failures (unparseable/missing
          # report); the gate below is the single arbiter and reads files only.
          if [ "$fatal" -ne 0 ]; then
            touch mutants.out/infra.tag
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutants-${{ matrix.name }}
          path: mutants.out
          retention-days: 30
      - name: Fail on missed mutants or mutation infrastructure errors
        if: always()
        run: |
          missed=$(wc -l < mutants.out/missed.txt 2>/dev/null || echo 0)
          if [ -f mutants.out/infra.tag ]; then
            echo "mutation testing infra error (unparseable report / no mutants)"
            exit 1
          fi
          echo "mutation testing: missed=$missed"
          if [ "$missed" -gt 0 ]; then
            echo "missed mutants detected — see the mutants-${{ matrix.name }} artifact"
            exit 1
          fi

  mutation-summary:
    name: Mutation Tests Summary
    if: always()
    needs: [mutation-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Download all mutant artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: mutants-*
          path: mutants/
          merge-multiple: false
      - name: Report results
        run: |
          echo "## Mutation Testing Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Shard | Caught | Missed | Timeouts | Not covered |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|---|---|" >> $GITHUB_STEP_SUMMARY
          total_caught=0
          total_missed=0
          total_timeout=0
          total_notcovered=0
          while IFS= read -r caught_file; do
            dir=$(dirname "$caught_file")
            name=$(basename "$dir")
            if [[ "$name" == mutants-* ]]; then
              name="${name#mutants-}"
            fi
            caught=$(wc -l < "$caught_file")
            missed=0; timeout=0; notcovered=0
            [ -f "$dir/missed.txt" ] && missed=$(wc -l < "$dir/missed.txt")
            [ -f "$dir/unviable.txt" ] && timeout=$(wc -l < "$dir/unviable.txt")
            [ -f "$dir/notcovered.txt" ] && notcovered=$(wc -l < "$dir/notcovered.txt")
            total_caught=$((total_caught + caught))
            total_missed=$((total_missed + missed))
            total_timeout=$((total_timeout + timeout))
            total_notcovered=$((total_notcovered + notcovered))
            if [ "$missed" -gt 0 ]; then
              echo "| $name | $caught | **$missed** | $timeout | $notcovered |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| $name | $caught | $missed | $timeout | $notcovered |" >> $GITHUB_STEP_SUMMARY
            fi
          done < <(find mutants -name caught.txt 2>/dev/null | sort) || true
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total: $total_caught caught / $total_missed missed / $total_timeout timeouts / $total_notcovered not covered**" >> $GITHUB_STEP_SUMMARY

  # ── SEQUENTIAL DEPLOYMENT JOBS ───────────────────────
  deploy-web:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [unit-tests, e2e-android]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Build Web
        run: |
          flutter build web --base-href "/GameTracker/" --release --dart-define=PREMIUM_EMAILS=${{ secrets.PREMIUM_EMAILS }} --dart-define=GROUP_SYNC_EMAILS=${{ secrets.GROUP_SYNC_EMAILS }} --dart-define=GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          mv build/web/index.html build/web/app.html
          cp web/landing.html build/web/index.html
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/web
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

  build-android:
    name: Build Android
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    needs: [scan-secrets, codeql-analysis, flutter-audit, unit-tests, mutation-tests]
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'pull_request' && 'build-review' || 'build' }}
    outputs:
      artifact-name: GameTracker-release-${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Create stub google-services.json (PR)
        # "Build Debug APK (PR)" below runs `flutter build apk --debug` for
        # every pull request, which triggers the Google Services Gradle
        # plugin (:app:processDebugGoogleServices) regardless of whether
        # real Firebase secrets are available. Non-PR runs get a real file
        # from "Prepare Signing & Firebase" further down; PR runs need a
        # placeholder so that task has something to read. Same stub used
        # by the e2e-android job.
        if: github.event_name == 'pull_request'
        run: |
          cat > android/app/google-services.json << 'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id":     "game-tracker-stub",
              "storage_bucket": "game-tracker-stub.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                "android_client_info": { "package_name": "com.stellasecret.gametracker" }
              },
              "oauth_client":  [],
              "api_key":       [{ "current_key": "stub" }],
              "services":      { "appinvite_service": { "other_platform_oauth_client": [] } }
            }],
            "configuration_version": "1"
          }
          JSON
      - name: Prepare Signing & Firebase
        if: github.event_name != 'pull_request'
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks
          cat > android/key.properties << PROPS
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=keystore.jks
          PROPS
          sed -i "s/versionCode .*/versionCode ${{ github.run_number }}/" android/app/build.gradle
      - name: Build Android (APK & AAB)
        if: github.event_name != 'pull_request'
        env:
          # Gradle auto-exposes ORG_GRADLE_PROJECT_<name> env vars as
          # project.findProperty("<name>") — this is how the native-side
          # AdMob App ID (consumed by manifestPlaceholders in
          # android/app/build.gradle) reaches AndroidManifest.xml, since
          # --dart-define only reaches Dart code, not the manifest. Must
          # stay in sync with the ADMOB_REWARDED_AD_UNIT_ANDROID secret
          # passed via --dart-define below — same AdMob "app" entry, or ad
          # requests fail with ERROR_CODE_INVALID_REQUEST.
          ORG_GRADLE_PROJECT_ADMOB_APPLICATION_ID_ANDROID: ${{ secrets.ADMOB_APPLICATION_ID_ANDROID }}
        run: |
          flutter build apk --release --target-platform android-arm64 --dart-define=PREMIUM_EMAILS=${{ secrets.PREMIUM_EMAILS }} --dart-define=GROUP_SYNC_EMAILS=${{ secrets.GROUP_SYNC_EMAILS }} --dart-define=GOOGLE_SERVER_CLIENT_ID=${{ secrets.GOOGLE_SERVER_CLIENT_ID }} --dart-define=ADMOB_REWARDED_AD_UNIT_ANDROID=${{ secrets.ADMOB_REWARDED_AD_UNIT_ANDROID }} --dart-define=REVENUECAT_API_KEY_ANDROID=${{ secrets.REVENUECAT_API_KEY_ANDROID }}
          flutter build appbundle --release --dart-define=PREMIUM_EMAILS=${{ secrets.PREMIUM_EMAILS }} --dart-define=GROUP_SYNC_EMAILS=${{ secrets.GROUP_SYNC_EMAILS }} --dart-define=GOOGLE_SERVER_CLIENT_ID=${{ secrets.GOOGLE_SERVER_CLIENT_ID }} --dart-define=ADMOB_REWARDED_AD_UNIT_ANDROID=${{ secrets.ADMOB_REWARDED_AD_UNIT_ANDROID }} --dart-define=REVENUECAT_API_KEY_ANDROID=${{ secrets.REVENUECAT_API_KEY_ANDROID }}
      - name: Build Debug APK (PR)
        if: github.event_name == 'pull_request'
        run: flutter build apk --debug
      - name: Collect Android Artifacts
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/gametracker-${{ github.run_number }}-arm64.apk
          cp build/app/outputs/bundle/release/app-release.aab dist/gametracker-${{ github.run_number }}.aab
          [ -f build/app/outputs/mapping/release/mapping.txt ] && cp build/app/outputs/mapping/release/mapping.txt dist/mapping-${{ github.run_number }}.txt || true
      - name: Upload Release Artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: GameTracker-release-${{ github.run_number }}
          path: dist/
          retention-days: 7

  release:
    name: Create Release
    if: github.ref == 'refs/heads/main'
    needs: [e2e-android, build-android]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: GameTracker-release-${{ github.run_number }}
          path: dist/
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.run_number }}
          name: "GameTracker build #${{ github.run_number }}"
          body: "Build #${{ github.run_number }} — Qualité validée."
          files: |
            dist/*.apk
            dist/*.aab
            dist/*.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
